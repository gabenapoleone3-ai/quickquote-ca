<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QuickQuote CA</title><style>
body{font:15px system-ui;margin:auto;max-width:900px;padding:24px;background:#f4f4f2;color:#171717}h1{font-size:42px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;padding:20px;border-radius:16px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;font-weight:700;margin:4px}.primary{background:#111;color:white}.item{display:grid;grid-template-columns:2fr .6fr 1fr;gap:5px}.total{font-size:24px;font-weight:800;text-align:right}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}td:last-child,th:last-child{text-align:right}@media(max-width:700px){main{grid-template-columns:1fr}}@media print{.edit,h1,p{display:none}body{background:white}.card{padding:0}main{display:block}.preview{display:block}}
</style></head><body><h1>QuickQuote CA</h1><p>Free estimate & invoice maker for Canadian trades and service businesses. No account required.</p><main>
<section class="card edit"><label>Document</label><select id="type"><option>Estimate</option><option>Invoice</option></select><label>Your business</label><input id="biz" placeholder="Business name"><label>Contact</label><input id="contact" placeholder="Email / phone"><label>Client</label><input id="client" placeholder="Client name"><label>Tax</label><select id="tax"><option value="0">0%</option><option value=".05">5% GST</option><option value=".13" selected>13% HST</option><option value=".15">15% HST</option></select><label>Items</label><div id="items"></div><button onclick="add()">+ Item</button><label>Notes</label><textarea id="notes" placeholder="Payment terms, validity, notes"></textarea><button class="primary" onclick="print()">Print / Save PDF</button><button onclick="save()">Save business info</button></section>
<section class="card preview"><h2 id="pt">ESTIMATE</h2><b id="pb">Your Business</b><div id="pc"></div><p>Prepared for: <b id="pcl">Client</b></p><table><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table><div id="sub" style="text-align:right"></div><div id="tx" style="text-align:right"></div><div class="total" id="tot"></div><p id="pn"></p></section>
</main><script>
const $=x=>document.getElementById(x),m=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n||0);
function add(d='',q=1,r=''){let e=document.createElement('div');e.className='item';e.innerHTML=`<input class=d placeholder="Description" value="${d}"><input class=q type=number value="${q}"><input class=r type=number placeholder="Rate" value="${r}">`;e.querySelectorAll('input').forEach(x=>x.oninput=render);$('items').append(e);render()}
function render(){$('pt').textContent=$('type').value.toUpperCase();$('pb').textContent=$('biz').value||'Your Business';$('pc').textContent=$('contact').value;$('pcl').textContent=$('client').value||'Client';$('pn').textContent=$('notes').value;let s=0,o='';document.querySelectorAll('.item').forEach(e=>{let d=e.querySelector('.d').value,q=+e.querySelector('.q').value||0,r=+e.querySelector('.r').value||0,a=q*r;s+=a;o+=`<tr><td>${d}</td><td>${m(a)}</td></tr>`});$('rows').innerHTML=o;let t=s*+$('tax').value;$('sub').textContent='Subtotal: '+m(s);$('tx').textContent='Tax: '+m(t);$('tot').textContent='Total: '+m(s+t)}
['type','biz','contact','client','tax','notes'].forEach(x=>$(x).oninput=render);
function save(){localStorage.setItem('qqbiz',JSON.stringify({biz:$('biz').value,contact:$('contact').value}));alert('Saved locally.')}
try{let x=JSON.parse(localStorage.getItem('qqbiz'));if(x){$('biz').value=x.biz||'';$('contact').value=x.contact||''}}catch(e){} add('Labour',1,'');add('Materials',1,'');render();
</script></body></html>
